<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Boîte de réception — PinkParaBox</title>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">✉</div>
        <span>PinkParaBox</span>
    </div>

    <nav>
        <a href="mail.html">Boîte de réception</a>
        <a href="sent.html">Envoyés</a>
        <a href="compose.html">Nouveau message</a>
        <a href="settings.html">Paramètres</a>
        <button type="button" onclick="logout()">Déconnexion</button>
    </nav>
</header>

<main class="compose-page">
    <section class="compose-card">
        <div class="compose-title">
            <h1>Boîte de réception</h1>
            <p id="account-email">Chargement...</p>
        </div>

        <div id="status">Chargement des messages...</div>
        <div id="messages"></div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

function getSender(message) {
    return (
        message.from_addr ||
        message.from?.address ||
        "Expéditeur inconnu"
    );
}

function getSubject(message) {
    return message.subject || "(Sans objet)";
}

function getDate(message) {
    const value = message.received_at || message.receivedAt;

    if (!value) return "";

    const date = new Date(
        typeof value === "number" && value < 10000000000
            ? value * 1000
            : value
    );

    return date.toLocaleString("fr-FR", {
        dateStyle: "short",
        timeStyle: "short"
    });
}

async function loadInbox() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("account-email").textContent =
        session.user.email;

    const response = await fetch(`${API_URL}/mail`, {
        headers: {
            "Authorization": `Bearer ${session.access_token}`
        }
    });

    const data = await response.json();

    if (!response.ok) {
        document.getElementById("status").textContent =
            data.error || "Impossible de charger les messages.";
        return;
    }

    const messages = data.messages || [];
    const container = document.getElementById("messages");

    document.getElementById("status").textContent =
        messages.length === 0
            ? "Aucun message reçu."
            : `${messages.length} message(s) reçu(s).`;

    container.innerHTML = "";

    for (const message of messages) {
        const id = message.id || message.message_id || message._id;

        const row = document.createElement("div");
        row.className = "message-row";
        row.style.cursor = "pointer";
        row.style.padding = "12px 0";
        row.style.borderBottom = "1px solid var(--blue-border)";
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";

        row.innerHTML = `
            <div>
                <strong>${escapeHtml(getSender(message))}</strong>
                <div>${escapeHtml(getSubject(message))}</div>
            </div>
            <small>${escapeHtml(getDate(message))}</small>
        `;

        const detail = document.createElement("div");
        detail.style.display = "none";
        detail.style.padding = "15px";
        detail.style.margin = "0 0 12px";
        detail.style.background = "var(--blue-soft)";
        detail.style.borderRadius = "10px";
        detail.style.whiteSpace = "pre-wrap";
        detail.style.wordBreak = "break-word";

        row.addEventListener("click", async () => {
            const isOpen = detail.style.display === "block";

            if (isOpen) {
                detail.style.display = "none";
                return;
            }

            if (!detail.dataset.loaded) {
                detail.textContent = "Chargement du message...";
                detail.style.display = "block";

                if (!id) {
                    detail.textContent = "Impossible d'ouvrir ce message (identifiant manquant).";
                    return;
                }

                const {
                    data: { session: currentSession }
                } = await supabaseClient.auth.getSession();

                try {
                    const detailResponse = await fetch(
                        `${API_URL}/mail/${encodeURIComponent(id)}`,
                        {
                            headers: {
                                "Authorization": `Bearer ${currentSession.access_token}`
                            }
                        }
                    );

                    const detailData = await detailResponse.json();

                    if (!detailResponse.ok) {
                        detail.textContent = detailData.error || "Impossible de charger ce message.";
                        return;
                    }

                    const full = detailData.message || detailData;

                    detail.textContent =
                        full.text || full.html || full.body || "(Message vide)";

                    detail.dataset.loaded = "1";
                } catch (err) {
                    detail.textContent = "Erreur réseau lors du chargement.";
                }
            } else {
                detail.style.display = "block";
            }
        });

        container.appendChild(row);
        container.appendChild(detail);
    }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}

loadInbox();
</script>

</body>
</html>
