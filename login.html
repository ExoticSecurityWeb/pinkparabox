<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Connexion — PinkParaBox</title>
</head>

<body>

    <main class="page-center">

        <section class="auth-card">

            <div class="logo">
                <div class="logo-icon">✉</div>
                <h1>PinkParaBox</h1>
            </div>

            <p class="subtitle">Connectez-vous à votre messagerie</p>

            <form>

                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="vous@pinkparabox.abrdns.com"
                    required
                >

                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Votre mot de passe"
                    required
                >

                <button type="submit" class="main-button">
                    Se connecter
                </button>

            </form>

            <a href="index.html" class="back-link">
                ← Retour à l'accueil
            </a>

        </section>

    </main>

</body>
</html>
