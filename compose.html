<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Nouveau message — PinkParaBox</title>
</head>

<body>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✉</div>
            <span>PinkParaBox</span>
        </div>

        <nav>
            <a href="mail.html">Boîte de réception</a>
            <a href="sent.html">Envoyés</a>
            <a href="settings.html">Paramètres</a>
        </nav>
    </header>

    <main class="compose-page">

        <section class="compose-card">

            <div class="compose-title">
                <h1>Nouveau message</h1>
                <p>Rédigez votre message</p>
            </div>

            <form>

                <label for="to">Destinataire</label>
                <input
                    type="email"
                    id="to"
                    placeholder="destinataire@exemple.com"
                    required
                >

                <label for="subject">Objet</label>
                <input
                    type="text"
                    id="subject"
                    placeholder="Objet du message"
                    required
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    rows="12"
                    placeholder="Écrivez votre message..."
                    required
                ></textarea>

                <div class="attachment-box">
                    <label for="attachment">Pièce jointe</label>
                    <input type="file" id="attachment">
                    <p>
                        Les pièces jointes ne sont pas acceptées par PinkParaBox.
                    </p>
                </div>

                <div class="compose-actions">
                    <button type="button" onclick="location.href='mail.html'">
                        Annuler
                    </button>

                    <button type="submit" class="main-button">
                        Envoyer le message
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
