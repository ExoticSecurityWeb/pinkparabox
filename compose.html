<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Nouveau message — PinkParaBox</title>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">✉</div>
        <span>PinkParaBox</span>
    </div>

    <nav>
        <a href="mail.html">Boîte de réception</a>
        <a href="sent.html">Envoyés</a>
        <a href="compose.html">Nouveau message</a>
        <a href="settings.html">Paramètres</a>
        <button type="button" onclick="logout()">Déconnexion</button>
    </nav>
</header>

<main class="compose-page">
    <section class="compose-card">
        <div class="compose-title">
            <h1>Nouveau message</h1>
            <p id="account-email">Chargement...</p>
        </div>

        <form id="compose-form">
            <label for="to">À</label>
            <input type="email" id="to" placeholder="destinataire@exemple.com" required>

            <label for="subject">Objet</label>
            <input type="text" id="subject" placeholder="Objet du message" required>

            <label for="body">Message</label>
            <textarea id="body" rows="10" placeholder="Écrivez votre message..." required></textarea>

            <p id="status" style="display:none;"></p>

            <div class="compose-actions">
                <button type="submit" class="main-button" id="send-button">Envoyer</button>
            </div>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let currentSession = null;

async function loadCompose() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    currentSession = session;

    document.getElementById("account-email").textContent =
        session.user.email;
}

const form = document.getElementById("compose-form");
const statusEl = document.getElementById("status");
const sendButton = document.getElementById("send-button");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!currentSession) return;

    const to = document.getElementById("to").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const body = document.getElementById("body").value;

    statusEl.style.display = "none";
    sendButton.disabled = true;
    sendButton.textContent = "Envoi...";

    try {
        const response = await fetch(`${API_URL}/send`, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${currentSession.access_token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ to, subject, body })
        });

        const data = await response.json();

        if (!response.ok) {
            statusEl.textContent = data.error || "Échec de l'envoi.";
            statusEl.style.color = "#c0392b";
            statusEl.style.display = "block";
            return;
        }

        statusEl.textContent = "Message envoyé.";
        statusEl.style.color = "var(--blue-dark)";
        statusEl.style.display = "block";
        form.reset();
    } catch (err) {
        statusEl.textContent = "Erreur réseau, réessayez.";
        statusEl.style.color = "#c0392b";
        statusEl.style.display = "block";
    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Envoyer";
    }
});

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}

loadCompose();
</script>

</body>
</html>
