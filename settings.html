<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Paramètres — PinkParaBox</title>
</head>

<body>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✉</div>
            <span>PinkParaBox</span>
        </div>

        <nav>
            <a href="mail.html">Boîte de réception</a>
            <a href="sent.html">Envoyés</a>
            <a href="settings.html" class="active">Paramètres</a>
            <a href="index.html">Déconnexion</a>
        </nav>
    </header>

    <main class="settings-page">

        <section class="settings-card">

            <div class="settings-title">
                <h1>Paramètres</h1>
                <p>Gérez votre compte PinkParaBox</p>
            </div>

            <div class="settings-section">

                <h2>Compte</h2>

                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    value=""
                    placeholder="vous@pinkparabox.abrdns.com"
                    disabled
                >

                <label for="name">Nom affiché</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Votre nom"
                >

                <button class="main-button">
                    Enregistrer
                </button>

            </div>

            <div class="settings-section">

                <h2>Apparence</h2>

                <label for="theme">Thème</label>

                <select id="theme">
                    <option value="system">Système</option>
                    <option value="light">Clair</option>
                    <option value="dark">Sombre</option>
                </select>

            </div>

            <div class="settings-actions">

                <button onclick="location.href='mail.html'">
                    ← Retour à la boîte de réception
                </button>

            </div>

        </section>

    </main>

</body>
</html>
