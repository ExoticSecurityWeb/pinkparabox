<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Paramètres — PinkParaBox</title>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">✉</div>
        <span>PinkParaBox</span>
    </div>

    <nav>
        <a href="mail.html">Boîte de réception</a>
        <a href="sent.html">Envoyés</a>
        <a href="compose.html">Nouveau message</a>
        <a href="settings.html">Paramètres</a>
        <button type="button" onclick="logout()">Déconnexion</button>
    </nav>
</header>

<main class="compose-page">
    <section class="compose-card">
        <div class="compose-title">
            <h1>Paramètres</h1>
            <p>Votre compte PinkParaBox</p>
        </div>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" readonly>

        <p id="status">Chargement...</p>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

async function loadSettings() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    const response = await fetch(`${API_URL}/me`, {
        headers: {
            "Authorization": `Bearer ${session.access_token}`
        }
    });

    const data = await response.json();

    if (!response.ok) {
        document.getElementById("status").textContent =
            data.error || "Impossible de charger le compte.";
        return;
    }

    document.getElementById("email").value =
        data.user.email;

    document.getElementById("status").textContent =
        "Compte connecté.";
}

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}

loadSettings();
</script>

</body>
</html>
