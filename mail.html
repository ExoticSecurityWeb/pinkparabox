<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Boîte de réception — PinkParaBox</title>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">✉</div>
        <span>PinkParaBox</span>
    </div>

    <nav>
        <a href="mail.html" class="active">Boîte de réception</a>
        <a href="sent.html">Envoyés</a>
        <a href="settings.html">Paramètres</a>
        <a href="index.html" id="logout">Déconnexion</a>
    </nav>
</header>

<main class="mail-layout">

    <aside class="sidebar">
        <button class="compose-button" onclick="location.href='compose.html'">
            ＋ Nouveau message
        </button>

        <div class="folder active">
            <span>📥</span>
            <span>Boîte de réception</span>
        </div>

        <div class="folder" onclick="location.href='sent.html'">
            <span>📤</span>
            <span>Messages envoyés</span>
        </div>
    </aside>

    <section class="mail-content">

        <div class="mail-header">
            <div>
                <h1>Boîte de réception</h1>
                <p id="mail-status">Chargement des messages…</p>
            </div>

            <button class="refresh-button" id="refresh">
                ↻ Actualiser
            </button>
        </div>

        <div class="mail-list" id="mail-list">

            <div class="empty-mail">
                <div class="empty-icon">⏳</div>
                <h2>Chargement…</h2>
                <p>Récupération de vos messages.</p>
            </div>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const mailList = document.getElementById("mail-list");
const mailStatus = document.getElementById("mail-status");
const refreshButton = document.getElementById("refresh");

async function loadMessages() {

    mailStatus.textContent = "Chargement des messages…";

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/mail`,
            {
                headers: {
                    "Authorization": `Bearer ${session.access_token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Erreur lors de la récupération des mails.");
        }

        const messages = Array.isArray(data)
            ? data
            : (data.messages || data.data || []);

        displayMessages(messages);

    } catch (error) {

        console.error(error);

        mailStatus.textContent = "Erreur";

        mailList.innerHTML = `
            <div class="empty-mail">
                <div class="empty-icon">⚠️</div>
                <h2>Impossible de charger les messages</h2>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;
    }
}

function displayMessages(messages) {

    if (!messages.length) {

        mailStatus.textContent = "Aucun message";

        mailList.innerHTML = `
            <div class="empty-mail">
                <div class="empty-icon">📭</div>
                <h2>Aucun message</h2>
                <p>Votre boîte de réception est actuellement vide.</p>
            </div>
        `;

        return;
    }

    mailStatus.textContent =
        `${messages.length} message${messages.length > 1 ? "s" : ""}`;

    mailList.innerHTML = "";

    messages.forEach(message => {

        const item = document.createElement("div");

        item.className = "mail-item";

        const sender =
            message.from ||
            message.from_addr ||
            message.sender ||
            "Expéditeur inconnu";

        const subject =
            message.subject ||
            "(Sans objet)";

        const preview =
            message.text ||
            message.snippet ||
            "";

        const date =
            message.receivedAt ||
            message.received_at ||
            message.createdAt ||
            "";

        item.innerHTML = `
            <div class="mail-item-main">
                <strong>${escapeHtml(sender)}</strong>
                <span>${escapeHtml(subject)}</span>
                <p>${escapeHtml(preview).substring(0, 120)}</p>
            </div>

            <div class="mail-item-date">
                ${escapeHtml(formatDate(date))}
            </div>
        `;

        mailList.appendChild(item);
    });
}

function formatDate(value) {

    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString("fr-FR", {
        dateStyle: "short",
        timeStyle: "short"
    });
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

refreshButton.addEventListener("click", loadMessages);

document.getElementById("logout").addEventListener("click", async (event) => {

    event.preventDefault();

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";
});

loadMessages();

</script>

</body>
</html>
